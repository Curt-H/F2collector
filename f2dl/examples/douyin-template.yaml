douyin:
  cookie: null [登录后的cookie]
  cover: null [是否保存视频封面]
  desc: null [是否保存视频文案]
  folderize: null [boolean,是否将作品保存到单独的文件夹]
  interval: all [下载日期区间]
  languages: null 显示语言[]
  lyric: null [是否保存原声歌词]
  max_connections: null [网络请求并发连接数]
  max_counts: null [最大作品下载数]
  max_retries: null [网络请求超时重试数]
  max_tasks: null [异步的任务数]
  mode: null [string,下载模式]
  music: null [BOOLEAN,是否保存视频原声]
  naming: null [全局作品文件命名方式]
  page_counts: null [每页获取作品数]
  path: Download [作品下载位置,支持相对路径和绝对路径]
  timeout: null [网络请求超时时间]
  url: null [根据模式提供相应的链 [网络请求超时时间接]

说明
1. cookie: 需要登录后获取的cookie信息, 确保可以访问受限内容。
2. cover: 是否保存视频封面。默认为 true。仅保存原始尺寸封面。
3. desc: 是否保存视频文案。默认为 true。保留原始文案信息。
4. folderize: 是否将作品保存到单独的文件夹。默认为 true
5. mode: 下载模式, 支持以下几种: 
  one: 单个作品
  post: 主页作品
  like: 点赞作品
  collection: 收藏作品
  collects: 收藏夹作品
  music: 收藏音乐
  mix: 合集
  live: 直播  
6. --naming: 全局作品文件命名方式。默认为 {create}_{desc}, 支持的变量有: {nickname}, {create}, {aweme_id}, {desc}, {uid}。支持的分割符有: _, -。
  {nickname}: 作者昵称
  {create}: 作品创建时间
  {aweme_id}: 作品ID
  {desc}: 作品文案
  {uid}: 作者ID
7. --cookie: 登录后的 Cookie。大部分接口需要登录后才能获取数据, 所以需要提供登录后的 Cookie。
--interval
下载日期区间发布的作品，格式：年-月-日|年-月-日。例如：2022-01-01|2023-01-01，设置all 为下载所有作品。

--timeout
网络请求超时时间。默认为 10 秒。

--max_retries
网络请求超时重试数。默认为 5 次。

--max-connections
网络请求并发连接数。默认为 10。

--max-tasks
异步的任务数。默认为 5。

--max-counts
最大作品下载数。设置为 None 或 0 表示无限制。默认为 0。

--page-counts
从接口每页可获取作品数，不建议超过 20。默认为 20。

--languages
指定显示语言。默认值为 zh_CN，支持选项：zh_CN 和 en_US，不支持通过配置文件修改。

--proxies
配置代理服务器，支持最多两个参数，分别对应 http:// 和 https:// 协议。

例如：--proxies http://x.x.x.x https://x.x.x.x。

--lyric
是否保存原声歌词。默认为 false。保存为 .lrc 格式。
